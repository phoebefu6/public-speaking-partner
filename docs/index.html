<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Speech Partner</title>
<style>
  :root {
    /* Light only — the page keeps its own colours whatever the device is set to. */
    color-scheme: light;
    --bg: #fff6f9;              /* blush cream */
    --panel: #ffffff;
    --ink: #3a2f4d;             /* soft plum, gentler than black */
    --muted: #6d6187;        /* dark enough to read on blush; #8a7fa3 measured 3.5:1 */
    --line: #f2e6f1;
    --accent: #a06bf0;          /* lavender */
    --accent-soft: #f6eeff;
    --coral: #ff85a1;           /* candy pink */
    --amber: #ffb86b;           /* peach */
    --teal: #5ccfc0;            /* mint */
    --sky: #7fbcf5;             /* baby blue */
    --grass: #86d18f;           /* pistachio */
    --good: var(--grass);
    --warn: var(--amber);
    /* Pastel fills with text dark enough to read: a cute chip is still a legible one. */
    --chip-bg-s: 86%; --chip-bg-l: 95%;
    --chip-fg-s: 58%; --chip-fg-l: 30%;   /* 30%: at 36% the palest hues fell to 3.8:1 */
    --tint: 30%;                /* pastels need a heavier pour to register at all */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  /* A CSS display rule beats the hidden attribute's UA default, and #lock sets display:grid --
     without this the lock screen stays painted on top of the unlocked library. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; }
  a { color: #7b3fd4; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: var(--accent-soft); padding: .1em .35em; border-radius: 4px; }

  /* ---------------- lock screen ---------------- */
  #lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  #lock .card { width: min(420px, 100%); text-align: center; }
  #lock h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  #lock p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .row { display: flex; gap: 8px; }
  input[type=password], input[type=search] {
    flex: 1; padding: 11px 13px; font-size: 15px; font-family: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 11px 17px; font-size: 15px; font-family: inherit; font-weight: 500; cursor: pointer;
    background: var(--ink); color: var(--bg); border: 0; border-radius: 9px;
  }
  button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 14px; font-size: 13.5px; color: var(--muted); }
  #msg.bad { color: #e0557a; }

  /* ---------------- chrome ---------------- */
  header {
    position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .bar { max-width: 940px; margin: 0 auto; padding: 11px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand {
    font-family: var(--serif); font-weight: 700; font-size: 17px;
    background: linear-gradient(95deg, #e0537e, #7a3fd0 55%, #1f8f82);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
  nav a {
    padding: 6px 12px; border-radius: 7px; font-size: 14px; text-decoration: none;
    color: var(--muted); font-weight: 500;
  }
  nav a:hover { color: #7b3fd4; }
  nav a.on {
    background: linear-gradient(100deg, #7a3fd0, #c93f6b);
    color: #fff; box-shadow: 0 3px 12px -4px #c07be0;
  }
  main { max-width: 940px; margin: 0 auto; padding: 26px 18px 80px; }
  h2.view { font-family: var(--serif); font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  h2.view::after {
    content: ''; display: block; width: 54px; height: 4px; border-radius: 3px; margin-top: 7px;
    background: linear-gradient(90deg, var(--coral), var(--amber) 45%, var(--teal));
  }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 11px; transition: transform .12s, box-shadow .12s;
  }
  main .card:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -14px #cba6f0; }
  .card a.t { font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--ink); text-decoration: none; display: block; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 5px; display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 20px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; }
  .chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  /* --h is set per element from the label, so a topic keeps its colour everywhere. */
  .chip.hue, .chip[class*="lvl-"], .facet.hue .dot {
    background: hsl(var(--h) var(--chip-bg-s) var(--chip-bg-l));
    color: hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));
    border: 0;
  }
  .chip.lvl-A2 { --h: 150; } .chip.lvl-B1 { --h: 174; }
  .chip.lvl-B2 { --h: 32; }  .chip.lvl-C1 { --h: 272; } .chip.lvl-C2 { --h: 340; }
  .chip.count { background: #e2f6e6; color: #236a35; border: 0; font-weight: 600; }
  .chip.none { background: #ffe6ed; color: #b02e54; border: 0; font-weight: 600; }

  /* ---------------- transcript ---------------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 18px; }
  .toolbar button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 7px 13px; font-size: 13.5px; }
  .toolbar button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .para { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .para.split { grid-template-columns: 1fr 1fr; }
  .para p { margin: 0; font-family: var(--serif); font-size: 17px; line-height: 1.68; }
  .para .verbatim { color: var(--muted); }
  .para.split .verbatim { font-size: 15.5px; }
  .who { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #c13c60; display: block; margin-bottom: 2px; }
  .stage { color: var(--muted); font-style: italic; }
  mark.fix {
    background: linear-gradient(transparent 58%, color-mix(in srgb, var(--grass) 42%, transparent) 0);
    color: inherit; border-radius: 2px; padding: 0 1px;
  }
  .fixes { margin-top: 7px; display: flex; flex-direction: column; gap: 5px; }
  .fix-note { font-family: var(--sans); font-size: 12.5px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; }
  .tag { font-size: 10px; font-weight: 800; border-radius: 4px; padding: 1px 5px; flex: none; }
  /* Solid pastels, not translucent ones: a fill that changes with whatever sits behind it
     cannot be checked for contrast once and trusted. Letters take a deeper tone of the hue. */
  .tag.g { background: #e2f6e6; color: #236a35; }
  .tag.t { background: #e2f0fd; color: #1a5f99; }
  .tag.q { background: #fdeedb; color: #8d5307; }
  .tag.k { background: linear-gradient(100deg, #7a3fd0, #c93f6b); color: #fff; }
  .was { text-decoration: line-through; opacity: .7; }

  .prose h3 { font-family: var(--serif); font-size: 19px; margin: 26px 0 6px; }
  .prose h4, .prose h5 { font-family: var(--serif); font-size: 16px; margin: 20px 0 5px; }
  .prose p { margin: 0 0 11px; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .prose li { margin-bottom: 4px; }
  .prose li.sub { list-style: none; margin-left: -8px; color: var(--muted); font-size: 13.5px; }
  .prose blockquote {
    margin: 0 0 14px; padding: 10px 0 10px 16px; border-left: 3px solid var(--accent);
    font-family: var(--serif); font-size: 18px;
  }
  .prose sup { color: var(--muted); font-size: 11px; }
  .wikilink { color: #7b3fd4; }
  .box { color: var(--muted); }

  .notice {
    background: linear-gradient(104deg,
      color-mix(in srgb, var(--amber) var(--tint), transparent),
      color-mix(in srgb, var(--accent) var(--tint), transparent));
    border: 0; border-radius: 11px;
    padding: 11px 14px; font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5;
  }
  .notice strong { color: var(--ink); }
  .layout { display: grid; grid-template-columns: 182px 1fr; gap: 24px; align-items: start; }
  .facets { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 1px; }
  .facet-head {
    font-size: 10.5px; font-weight: 800; letter-spacing: .09em; color: var(--muted);
    margin: 16px 0 5px;
  }
  .facet-head:first-child { margin-top: 0; }
  .facet {
    display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    background: none; color: var(--ink); border: 0; border-radius: 7px; padding: 5px 8px;
    font-size: 13px; font-weight: 400;
  }
  .facet:hover { background: var(--accent-soft); }
  .facet .n { color: var(--muted); font-size: 12px; }
  .facet.clear { background: linear-gradient(100deg, #7a3fd0, #c93f6b); color: #fff; font-weight: 600; }
  .facet .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .facets { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .facet-head { width: 100%; margin: 6px 0 0; }
    .facet { width: auto; border: 1px solid var(--line); }
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .w {
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid hsl(var(--h, 272) 70% 62%);
    border-radius: 13px; padding: 13px 15px; cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .w:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -14px hsl(var(--h, 272) 60% 62%); }
  .w .hw { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .w .ipa { color: var(--muted); font-size: 12.5px; }
  .w .zh { font-size: 14px; margin-top: 3px; }
  dialog {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
    max-width: 620px; width: calc(100% - 32px); padding: 22px 24px;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .back { display: inline-block; margin-bottom: 14px; font-size: 14px; text-decoration: none; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) { .para.split { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="lock">
  <div class="card" style="background:none;border:0;padding:0">
    <h1>Speech Partner</h1>
    <p>This library is encrypted. Enter the passphrase to read it.</p>
    <form class="row" id="unlock-form">
      <input type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" autofocus>
      <button type="submit" id="go">Unlock</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<div id="app" hidden>
  <header><div class="bar">
    <span class="brand">Speech·Partner</span>
    <nav id="nav"></nav>
  </div></header>
  <main id="main"></main>
</div>

<dialog id="modal"><div id="modal-body" class="prose"></div></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) if (k != null) n.append(k);
  return n;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA = null;

/** A stable hue per label, so "AI" is the same colour in the sidebar and on every card.
 *  Spread around the wheel but skipping the muddy 50-70 band, which reads as dirty yellow. */
function hueOf(label) {
  let h = 0;
  const s = String(label ?? '').toLowerCase();
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return h >= 48 && h <= 72 ? (h + 40) % 360 : h;
}
const hued = (node, label) => (node.style.setProperty('--h', hueOf(label)), node);

/* ------------------------------------------------ unlock */

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(sealed, passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(sealed.kdf.salt), iterations: sealed.kdf.iterations, hash: sealed.kdf.hash },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt'],
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sealed.iv) }, key, b64(sealed.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

$('#unlock-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#msg'), go = $('#go');
  const passphrase = $('#pass').value;
  if (!passphrase) return;
  go.disabled = true;
  msg.className = '';
  msg.textContent = 'Decrypting…';
  try {
    const sealed = await (await fetch('payload.json', { cache: 'no-store' })).json();
    DATA = await decrypt(sealed, passphrase);
    try { sessionStorage.setItem('sp-pass', passphrase); } catch {}
    $('#lock').hidden = true;
    $('#app').hidden = false;
    route();
  } catch (err) {
    msg.className = 'bad';
    msg.textContent = 'That passphrase does not open this library.';
    $('#pass').select();
  } finally {
    go.disabled = false;
  }
});

// Survive a reload within the same tab without retyping.
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('sp-pass'); } catch {}
  if (!saved) return;
  try {
    const sealed = await (await fetch('payload.json', { cache: 'no-store' })).json();
    DATA = await decrypt(sealed, saved);
    $('#lock').hidden = true;
    $('#app').hidden = false;
    route();
  } catch { try { sessionStorage.removeItem('sp-pass'); } catch {} }
})();

/* ------------------------------------------------ transcript rendering */

const LABEL = /^([A-Z][A-Za-z.'’-]*(?:\s+[A-Z][A-Za-z.'’-]*){0,3}):\s*/;
const STAGE = /\((?:Applause|Laughter|Music|Video|Audio|Cheers|Singing)[^)]*\)/gi;

function renderParagraph(text, who) {
  const frag = document.createDocumentFragment();
  let body = String(text ?? '');
  const m = LABEL.exec(body);
  if (m && who) {
    frag.append(el('span', { className: 'who', title: who, textContent: who }));
    body = body.slice(m[0].length);
  }
  const p = el('p');
  p.innerHTML = esc(body).replace(STAGE, (s) => `<span class="stage">${s}</span>`);
  frag.append(p);
  return frag;
}

/** Show each correction inside the reviewed paragraph, so the edit stays visible. */
function markFixes(html, fixes) {
  let out = html;
  for (const f of fixes) {
    if (!f.now || f.type === 'k') continue;
    const needle = esc(f.now);
    if (needle && out.includes(needle)) out = out.replace(needle, `<mark class="fix">${needle}</mark>`);
  }
  return out;
}

function talkView(talk) {
  const wrap = el('div');
  wrap.append(el('a', { className: 'back', href: '#/talks', textContent: '← All talks' }));
  wrap.append(el('h2', { className: 'view', textContent: talk.title }));

  const bits = [talk.speaker, talk.source, talk.duration ? `${Math.round(talk.duration / 60)} min` : '',
                talk.words ? `${talk.words.toLocaleString()} words` : '', talk.difficulty].filter(Boolean);
  wrap.append(el('p', { className: 'sub', textContent: bits.join(' · ') }));

  const hasReviewed = Array.isArray(talk.reviewed) && talk.reviewed.length === talk.paragraphs.length;
  let mode = hasReviewed ? 'reviewed' : 'verbatim';

  const bar = el('div', { className: 'toolbar' });
  const body = el('div');

  const draw = () => {
    body.replaceChildren();
    const byPara = {};
    for (const c of talk.corrections || []) (byPara[c.p] ??= []).push(c);

    talk.paragraphs.forEach((verb, i) => {
      const rev = hasReviewed ? talk.reviewed[i] : verb;
      const fixes = byPara[i] || [];
      const row = el('div', { className: `para${mode === 'both' ? ' split' : ''}` });

      if (mode === 'both' || mode === 'verbatim') {
        const col = el('div', { className: mode === 'both' ? 'verbatim' : '' });
        col.append(renderParagraph(verb, talk.speakers?.[i]));
        row.append(col);
      }
      if (mode === 'both' || mode === 'reviewed') {
        const col = el('div');
        col.append(renderParagraph(rev, talk.speakers?.[i]));
        const p = col.querySelector('p');
        if (p && fixes.length) p.innerHTML = markFixes(p.innerHTML, fixes);
        if (fixes.length) {
          const notes = el('div', { className: 'fixes' });
          for (const f of fixes) {
            notes.append(el('div', { className: 'fix-note' },
              el('span', { className: `tag ${f.type}`, textContent: f.type.toUpperCase() }),
              el('span', {}, f.type === 'k'
                ? `Craft — left exactly as spoken. ${f.why || ''}`
                // A judgment call often quotes the line unchanged; showing it struck through
                // and retyped identically reads as an edit that did not happen.
                : f.was === f.now
                  ? `Flagged, not changed. ${f.why || ''}`
                  : [el('span', { className: 'was', textContent: f.was || '' }), ' → ', el('strong', { textContent: f.now || '' }), ` — ${f.why || ''}`]),
            ));
          }
          col.append(notes);
        }
        row.append(col);
      }
      body.append(row);
    });
  };

  const modes = hasReviewed
    ? [['reviewed', 'Corrected'], ['verbatim', 'Verbatim'], ['both', 'Side by side']]
    : [['verbatim', 'Verbatim']];
  for (const [key, label] of modes) {
    const b = el('button', { textContent: label, className: key === mode ? 'on' : '' });
    b.onclick = () => {
      mode = key;
      [...bar.querySelectorAll('button')].forEach((x) => x.classList.toggle('on', x === b));
      draw();
    };
    bar.append(b);
  }
  if (!hasReviewed) bar.append(el('span', { className: 'meta', textContent: 'No reviewed layer yet' }));
  if (talk.url) bar.append(el('a', { href: talk.url, target: '_blank', rel: 'noopener', className: 'meta', textContent: 'Watch ↗' }));

  draw();
  wrap.append(bar, body);

  if (talk.languageNotes) {
    wrap.append(el('h3', { style: 'font-family:var(--serif);font-size:21px;margin:34px 0 8px', textContent: 'Language notes' }));
    const box = el('div', { className: 'card prose' });
    box.innerHTML = talk.languageNotes;
    wrap.append(box);
  }
  if (talk.craft && talk.craft.trim()) {
    const box = el('div', { className: 'card prose', style: 'margin-top:12px' });
    box.innerHTML = talk.craft;
    wrap.append(box);
  }
  return wrap;
}

/* ------------------------------------------------ views */

function talkCard(t) {
  const card = el('div', { className: 'card' });
  card.append(el('a', { className: 't', href: `#/talk/${t.id}`, textContent: t.title }));
  const meta = el('div', { className: 'meta' });
  for (const b of [t.speaker, t.source, t.duration ? `${Math.round(t.duration / 60)} min` : '',
                   t.words ? `${t.words.toLocaleString()} words` : ''].filter(Boolean)) {
    meta.append(el('span', { textContent: b }));
  }
  if (t.difficulty) meta.append(el('span', { className: `chip lvl-${t.difficulty}`, textContent: t.difficulty }));
  const fixes = (t.corrections || []).length;
  meta.append(el('span', {
    className: `chip ${fixes ? 'count' : 'none'}`,
    textContent: fixes ? `${fixes} corrections` : 'unreviewed',
  }));
  card.append(meta);
  if (t.topics?.length) {
    const tags = el('div', { className: 'meta' });
    for (const topic of t.topics.slice(0, 6)) {
      tags.append(hued(el('span', { className: 'chip hue', textContent: topic }), topic));
    }
    card.append(tags);
  }
  return card;
}

function talksView() {
  const wrap = el('div');

  // Adding a talk needs the server: it fetches the page or the captions and writes a note
  // into the vault. Saying so beats a paste box that silently cannot work.
  wrap.append(el('div', { className: 'notice' },
    el('strong', { textContent: 'Read-only copy. ' }),
    'To add a talk, paste the link into the app on your Mac — ',
    el('code', { textContent: 'npm start' }),
    ' at ',
    el('code', { textContent: 'localhost:4321' }),
    ' — then rebuild this page with ',
    el('code', { textContent: 'npm run build-site' }),
    '.'));

  wrap.append(el('h2', { className: 'view', textContent: 'Talks' }));
  const sub = el('p', { className: 'sub' });
  wrap.append(sub);

  const search = el('input', { type: 'search', placeholder: 'Search every transcript…' });
  wrap.append(el('div', { className: 'toolbar' }, search));

  const layout = el('div', { className: 'layout' });
  const side = el('aside', { className: 'facets' });
  const list = el('div');
  layout.append(side, list);
  wrap.append(layout);

  // facet key -> selected value, or null for "everything"
  const picked = { source: null, difficulty: null, status: null, topic: null };

  const matches = (t, q) => {
    if (!q) return true;
    const hay = [t.title, t.speaker, t.source, (t.topics || []).join(' ')].join(' ').toLowerCase();
    if (hay.includes(q)) return true;
    const text = (t.reviewed || t.paragraphs || []).join(' ').toLowerCase();
    return text.includes(q);
  };

  const visible = () => {
    const q = search.value.trim().toLowerCase();
    return DATA.talks.filter((t) =>
      (!picked.source || t.source === picked.source) &&
      (!picked.difficulty || t.difficulty === picked.difficulty) &&
      (!picked.status || t.status === picked.status) &&
      (!picked.topic || (t.topics || []).includes(picked.topic)) &&
      matches(t, q));
  };

  /** Counts for one facet, computed against every other facet already applied, so a
   *  count never promises results that the current filters would exclude. */
  const countsFor = (key, valuesOf) => {
    const q = search.value.trim().toLowerCase();
    const others = DATA.talks.filter((t) =>
      (key === 'source' || !picked.source || t.source === picked.source) &&
      (key === 'difficulty' || !picked.difficulty || t.difficulty === picked.difficulty) &&
      (key === 'status' || !picked.status || t.status === picked.status) &&
      (key === 'topic' || !picked.topic || (t.topics || []).includes(picked.topic)) &&
      matches(t, q));
    const counts = new Map();
    for (const t of others) for (const v of valuesOf(t)) if (v) counts.set(v, (counts.get(v) || 0) + 1);
    return [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  };

  const drawFacets = () => {
    side.replaceChildren();
    const groups = [
      ['Source', 'source', (t) => [t.source]],
      ['Level', 'difficulty', (t) => [t.difficulty]],
      ['Status', 'status', (t) => [t.status]],
      ['Topic', 'topic', (t) => t.topics || []],
    ];
    for (const [label, key, valuesOf] of groups) {
      const rows = countsFor(key, valuesOf);
      if (!rows.length) continue;
      side.append(el('div', { className: 'facet-head', textContent: label.toUpperCase() }));
      if (picked[key]) {
        const clear = el('button', { className: 'facet clear', textContent: `× ${picked[key]}` });
        clear.onclick = () => { picked[key] = null; draw(); };
        side.append(clear);
        continue;
      }
      for (const [value, n] of rows) {
        const label = el('span', { style: 'display:flex;gap:7px;align-items:center' });
        if (key === 'topic') label.append(hued(el('span', { className: 'dot' }), value));
        label.append(el('span', { textContent: value }));
        const row = el('button', { className: `facet${key === 'topic' ? ' hue' : ''}` },
          label,
          el('span', { className: 'n', textContent: String(n) }));
        if (key === 'topic') hued(row, value);
        row.onclick = () => { picked[key] = value; draw(); };
        side.append(row);
      }
    }
  };

  const draw = () => {
    const rows = visible();
    const q = search.value.trim();
    sub.textContent = rows.length === DATA.talks.length
      ? `${DATA.talks.length} talks · a read-only snapshot of the vault`
      : `${rows.length} of ${DATA.talks.length} talks${q ? ` matching “${q}”` : ''}`;
    drawFacets();
    list.replaceChildren();
    if (!rows.length) {
      list.append(el('p', { className: 'empty', textContent: 'Nothing matches those filters.' }));
      return;
    }
    for (const t of rows) list.append(talkCard(t));
  };

  search.addEventListener('input', draw);
  draw();
  return wrap;
}

function wordsView() {
  const wrap = el('div');
  wrap.append(el('h2', { className: 'view', textContent: 'Words' }));
  wrap.append(el('p', { className: 'sub', textContent: `${DATA.words.length} words, each kept with the sentence it arrived in` }));

  const search = el('input', { type: 'search', placeholder: 'Filter words…' });
  wrap.append(el('div', { className: 'toolbar' }, search));
  const grid = el('div', { className: 'grid' });
  wrap.append(grid);

  const draw = (q = '') => {
    const needle = q.trim().toLowerCase();
    grid.replaceChildren();
    const rows = DATA.words.filter((w) =>
      !needle || w.word.toLowerCase().includes(needle) || String(w.zh).toLowerCase().includes(needle));
    if (!rows.length) return grid.append(el('p', { className: 'empty', textContent: 'Nothing matches.' }));
    for (const w of rows) {
      const card = el('div', { className: 'w' });
      card.append(el('div', { className: 'hw' }, w.word));
      if (w.ipa) card.append(el('div', { className: 'ipa', textContent: w.ipa }));
      if (w.zh) card.append(el('div', { className: 'zh', textContent: w.zh }));
      hued(card, w.talkTitle || w.word);
      if (w.band) card.append(el('div', { className: 'meta' }, el('span', { className: `chip lvl-${w.band}`, textContent: w.band })));
      card.onclick = () => {
        const b = $('#modal-body');
        b.replaceChildren();
        b.append(el('h3', { style: 'margin-top:0', textContent: w.word }));
        if (w.ipa) b.append(el('p', { className: 'sub', textContent: w.ipa }));
        const inner = el('div');
        inner.innerHTML = w.body;
        b.append(inner);
        if (w.talkTitle) b.append(el('p', { className: 'sub', textContent: `From “${w.talkTitle}”` }));
        $('#modal').showModal();
      };
      grid.append(card);
    }
  };
  search.addEventListener('input', () => draw(search.value));
  draw();
  return wrap;
}

function phrasesView() {
  const wrap = el('div');
  wrap.append(el('h2', { className: 'view', textContent: 'Phrases' }));
  wrap.append(el('p', { className: 'sub', textContent: `${DATA.phrases.length} lines worth reciting, filed by what the sentence does` }));

  const groups = {};
  for (const p of DATA.phrases) (groups[p.category] ??= []).push(p);

  for (const [cat, rows] of Object.entries(groups)) {
    wrap.append(hued(el('h3', {
      style: 'font-family:var(--serif);font-size:20px;margin:28px 0 4px;color:hsl(var(--h) 68% var(--chip-fg-l))',
      textContent: cat,
    }), cat));
    wrap.append(el('p', { className: 'sub', textContent: rows[0].categoryLabel }));
    for (const p of rows) {
      const card = el('div', { className: 'card' });
      card.append(hued(el('blockquote', {
        style: 'margin:0;padding:0 0 0 14px;border-left:3px solid hsl(var(--h) 72% 58%);'
             + 'font-family:var(--serif);font-size:18px',
        textContent: p.text,
      }), p.category));
      const meta = el('div', { className: 'meta' });
      for (const b of [p.speaker, p.talkTitle].filter(Boolean)) meta.append(el('span', { textContent: b }));
      card.append(meta);
      const why = el('div', { className: 'prose', style: 'margin-top:8px' });
      why.innerHTML = p.body;
      card.append(why);
      wrap.append(card);
    }
  }
  return wrap;
}

function notesView(key, title, blurb) {
  const wrap = el('div');
  wrap.append(el('h2', { className: 'view', textContent: title }));
  wrap.append(el('p', { className: 'sub', textContent: blurb }));
  const rows = DATA[key] || [];
  if (!rows.length) wrap.append(el('p', { className: 'empty', textContent: 'Nothing here yet.' }));
  for (const n of rows) {
    const card = el('div', { className: 'card prose' });
    card.append(el('h3', { style: 'margin-top:0', textContent: n.title }));
    const inner = el('div');
    inner.innerHTML = n.body;
    card.append(inner);
    wrap.append(card);
  }
  return wrap;
}

/* ------------------------------------------------ routing */

const TABS = [['#/talks', 'Talks'], ['#/words', 'Words'], ['#/phrases', 'Phrases'], ['#/craft', 'Craft'], ['#/coaching', 'Coaching']];

function route() {
  if (!DATA) return;
  const hash = location.hash || '#/talks';

  const nav = $('#nav');
  nav.replaceChildren();
  for (const [href, label] of TABS) {
    nav.append(el('a', { href, textContent: label, className: hash.startsWith(href) ? 'on' : '' }));
  }

  let view;
  const talkMatch = /^#\/talk\/(.+)$/.exec(hash);
  if (talkMatch) {
    const talk = DATA.talks.find((t) => t.id === decodeURIComponent(talkMatch[1]));
    view = talk ? talkView(talk) : el('p', { className: 'empty', textContent: 'No such talk.' });
  } else if (hash.startsWith('#/words')) view = wordsView();
  else if (hash.startsWith('#/phrases')) view = phrasesView();
  else if (hash.startsWith('#/craft')) view = notesView('craft', 'Craft', 'One note per talk: the opening move, the spine, the devices, the close.');
  else if (hash.startsWith('#/coaching')) view = notesView('coaching', 'Coaching', 'Recurring patterns across the whole library.');
  else view = talksView();

  $('#main').replaceChildren(view);
  window.scrollTo(0, 0);
}

addEventListener('hashchange', route);
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('#modal').close(); });
</script>
</body>
