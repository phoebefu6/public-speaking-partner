<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat sheet · Speech Partner</title>
<link rel="stylesheet" href="/app.css?v=4">
</head>
<body>
<main class="wrap narrow">
  <h1>Cheat sheet</h1>
  <p class="sub">Pick a slice of your vocabulary and take it with you.</p>

  <div style="display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1.5rem">
    <select class="field" id="scope" style="max-width:11rem">
      <option value="all">Everything</option>
      <option value="status">By status</option>
      <option value="talk">By talk</option>
      <option value="tag">By exam tag</option>
    </select>
    <select class="field" id="value" style="max-width:18rem; display:none"></select>
    <span style="flex:1"></span>
    <button class="btn ghost" id="print">Print / PDF</button>
    <button class="btn ghost" id="md">Markdown</button>
    <button class="btn ghost" id="csv">Anki CSV</button>
  </div>

  <div class="sheet" id="sheet"></div>
</main>
<script type="module" src="/sheet.js?v=4"></script>
</body>
</html>
